services:
  app:
    build:
      context: .
    init: true
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - path: .env.local
        required: false
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/ai').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
